name: E2E

# Runs this action (uses: ./) against the real Shipshape API through each marketplace: 2 requests per marketplace.
# RapidAPI needs the repository secret RAPIDAPI_KEY, API.market needs API_MARKET_KEY; a missing one skips its job.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *"   # monthly: 2 requests, so it fits the free Basic plan (15 a month)

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.market }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: rapidapi
            secret: RAPIDAPI_KEY
          - market: api.market
            secret: API_MARKET_KEY
    env:
      HAS_KEY: ${{ secrets[matrix.secret] != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::${{ matrix.secret }} is not set; skipping the ${{ matrix.market }} end-to-end test."
      - name: Lint the fixtures with the action
        if: env.HAS_KEY == 'true'
        id: lint
        continue-on-error: true   # the fixture Dockerfile has a high finding on purpose
        uses: ./
        with:
          rapidapi-key: ${{ matrix.market == 'rapidapi' && secrets.RAPIDAPI_KEY || '' }}
          api-market-key: ${{ matrix.market == 'api.market' && secrets.API_MARKET_KEY || '' }}
          mode: all
          dockerfile-paths: tests/fixtures/repo/Dockerfile
          kubernetes-paths: tests/fixtures/repo/k8s/deployment.yaml
          exclude-paths: ""
          max-requests: "2"
      - name: Check the outputs
        if: env.HAS_KEY == 'true'
        env:
          PASSED: ${{ steps.lint.outputs.passed }}
          WORST: ${{ steps.lint.outputs.worst-grade }}
          REQUESTS: ${{ steps.lint.outputs.requests-used }}
          QUOTA: ${{ steps.lint.outputs.quota-remaining }}
          OUTCOME: ${{ steps.lint.outcome }}
          MARKET: ${{ matrix.market }}
        run: |
          echo "passed=$PASSED worst=$WORST requests=$REQUESTS quota=$QUOTA outcome=$OUTCOME"
          test "$OUTCOME" = failure    # the high finding must fail the step
          test "$PASSED" = false
          test -n "$WORST"
          test "$REQUESTS" = 2
          if [ "$MARKET" = rapidapi ]; then test -n "$QUOTA"; fi   # RapidAPI's quota header came through
